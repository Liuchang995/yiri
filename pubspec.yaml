name: yiri
description: "一日 · 每天翻一页诗，在日历上点一笔。"
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  sqlite3: ^3.8.0
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  # 14.1.x 的 geolocator_linux 与 connectivity_plus 的 dbus 约束不兼容，
  # 这里固定到当前可解析的最新版本；移动端行为不受影响。
  geolocator: 14.0.1
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  lunar: ^1.7.7
  image_picker: ^1.2.4
  archive: ^4.5.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  camera: 0.10.6
  flutter_image_compress: ^2.5.1
  shared_preferences: ^2.5.6
  path: ^1.9.1
  uuid: ^4.6.0
  cross_file: ^0.3.5+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  assets:
    - assets/poetry.json

# Windows 上使用系统 SQLite 便于本地 analyze / 代码生成；
# Android 与 iOS 仍使用 sqlite3 包自带的原生库，避免依赖系统版本差异。
hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
        default: sqlite3
      # 国内直连 GitHub release 经常超时；包本身会校验每个二进制的
      # SHA-256，这里只替换下载地址。
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
